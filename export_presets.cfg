; 文件名：export_presets.cfg
; 干什么：安卓导出预设。Godot「项目 → 导出」时会读它。
; 手机上用 Godot 导出助手打 APK 时，也会自动识别这个文件。

[preset.0]
name="Android"
platform="Android"
runnable=true
export_path="kc_runner.apk"

[preset.0.options]
architectures/arm64-v8a=true      ; 64 位机型（现在主流手机）
architectures/armeabi-v7a=true    ; 32 位老机型
architectures/x86_64=false        ; 模拟器才用，手机不用
gradle_build/use_gradle_build=false
apk_expansion/enable=false
version/code=1
version/name="1.0.0"
screen/orientation=1              ; 1 = 竖屏
package/unique_name="com.kovak.kcrunner"
package/name="KC Runner"
package/signed=true               ; 自动签名，产出可直接安装的 APK
